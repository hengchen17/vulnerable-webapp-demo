<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Acme Corp Internal Portal{% endblock %}</title>
<style>
  body { font-family: Arial, sans-serif; background:#f4f5f7; margin:0; }
  header { background:#1f2937; color:#fff; padding:14px 24px; display:flex; justify-content:space-between; }
  header a { color:#fff; margin-left:16px; text-decoration:none; }
  main { max-width:700px; margin:32px auto; background:#fff; padding:24px; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  input, textarea, button { width:100%; padding:8px; margin:6px 0; box-sizing:border-box; }
  button { background:#2563eb; color:#fff; border:none; border-radius:4px; padding:10px; cursor:pointer; }
  .error { color:#b91c1c; }
  .post { border-bottom:1px solid #eee; padding:10px 0; }
  .badge { display:inline-block; background:#e5e7eb; padding:2px 8px; border-radius:10px; font-size:12px; }
</style>
</head>
<body>
<header>
  <div><strong>Acme Corp Internal Portal</strong></div>
  <nav>
    {% if session.get('user_id') %}
      <a href="/profile?employee_id={{ session['user_id'] }}">My Profile</a>
      <a href="/board">Board</a>
      <a href="/assistant">AI Assistant</a>
      {% if session.get('role') == 'admin' %}<a href="/admin">Admin</a>{% endif %}
      <a href="/logout">Logout</a>
    {% else %}
      <a href="/login">Login</a>
    {% endif %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
