{% extends "base.html" %}
{% block content %}
<h2>AI Assistant (internal beta)</h2>
<p style="font-size:13px;color:#666">Ask the assistant to summarize a message or answer a work question.</p>
<form method="POST">
  <textarea name="message" rows="3">{{ user_input }}</textarea>
  <button type="submit">Ask</button>
</form>
{% if reply %}
<hr>
<pre style="white-space:pre-wrap;background:#f8f8f8;padding:12px;border-radius:4px">{{ reply }}</pre>
{% endif %}
{% endblock %}
