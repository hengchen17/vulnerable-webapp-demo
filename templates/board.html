{% extends "base.html" %}
{% block content %}
<h2>Internal Bulletin Board</h2>
<form method="POST">
  <textarea name="content" rows="3" placeholder="Write a post..."></textarea>
  <button type="submit">Post</button>
</form>
<hr>
{% for post in posts %}
  <div class="post">
    <strong>{{ post['username'] }}</strong>
    <span style="color:#999;font-size:12px">{{ post['created_at'] }}</span>
    <!-- VULNERABLE: `|safe` disables Jinja2 autoescaping -> stored XSS -->
    <p>{{ post['content']|safe }}</p>
  </div>
{% endfor %}
{% endblock %}
